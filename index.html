<!doctype html>
<html
  lang="id"
  class="scroll-smooth snap-none md:snap-y md:snap-mandatory overflow-x-hidden"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Archive</title>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: ['"IBM Plex Mono"', "monospace"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="style/index.css" />
  </head>
  <body class="font-mono m-0 p-0 box-border text-slate-900">
    <audio id="bg-music" loop>
      <source src="asset/music/music.mp3" type="audio/mpeg" />
      Browser Anda tidak mendukung elemen audio.
    </audio>

    <div
      id="loading-screen"
      class="fixed inset-0 bg-slate-900 flex flex-col justify-center items-center z-[9999] text-slate-50 transition-all duration-800 ease-in-out"
    >
      <div class="loader-content text-center max-w-[350px] w-full px-5">
        <div class="text-xl font-semibold tracking-[3px] mb-2 text-white">
          VIRTUAL ARCHIVE
        </div>
        <div class="w-full h-1 bg-slate-800 rounded-sm overflow-hidden">
          <div
            id="loader-bar"
            class="w-0 h-full bg-sky-400 transition-[width] duration-75 ease-linear"
          ></div>
        </div>
        <div
          class="flex justify-between items-center mt-3 text-xs text-slate-500 tracking-[1px]"
        >
          <span>LOADING</span>
          <span id="loader-percentage">0%</span>
        </div>
      </div>
    </div>

    <nav
      id="navbar"
      class="fixed top-0 left-0 w-full h-[70px] bg-transparent flex justify-between items-center px-5 md:px-[50px] z-[1000] transition-colors duration-400 ease-in-out"
    >
      <div
        class="logo text-slate-900 text-2xl font-bold tracking-[1px] transition-colors duration-400 ease-in-out"
      >
        VA
      </div>
      <div class="nav-right flex items-center gap-[15px] md:gap-[30px]">
        <ul class="nav-links flex list-none gap-[15px] md:gap-[30px]">
          <li>
            <a
              href="index.html"
              class="text-slate-900 no-underline font-semibold transition-colors duration-300 hover:text-sky-400"
              >Home</a
            >
          </li>
          <li>
            <a
              href="history.html"
              class="text-slate-900 no-underline font-semibold transition-colors duration-300 hover:text-sky-400"
              >History</a
            >
          </li>
          <li>
            <a
              href="topology.html"
              class="text-slate-900 no-underline font-semibold transition-colors duration-300 hover:text-sky-400"
              >Lainnya</a
            >
          </li>
        </ul>
        <button
          id="musicToggleBtn"
          class="music-btn bg-transparent border-2 border-current rounded-full w-9 h-9 flex justify-center items-center cursor-pointer text-slate-900 transition-all duration-300 outline-none hover:bg-sky-400/20 hover:text-sky-400"
          title="Putar/Hentikan Musik"
        >
          <svg id="playIcon" viewBox="0 0 24 24" class="w-4 h-4 fill-current">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg
            id="pauseIcon"
            viewBox="0 0 24 24"
            class="w-4 h-4 fill-current"
            style="display: none"
          >
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
        </button>
      </div>
    </nav>

    <section
      id="hero"
      data-theme="light"
      class="relative w-full h-screen flex flex-col justify-center items-center text-center px-[15px] md:px-5 pt-[90px] pb-[60px] md:pt-[60px] md:pb-10 md:snap-start md:snap-always overflow-hidden z-[1]"
    >
      <h1
        class="fade-down font-bold text-[2.8rem] md:text-[4.5rem] mb-2.5 text-slate-900"
      >
        Virtual Archive
      </h1>
      <p
        class="fade-up text-[1.1rem] md:text-xl font-normal max-w-[700px] text-slate-800 mb-[30px] leading-relaxed"
        style="transition-delay: 0.2s"
      >
        Menelusuri perjalanan dari protokol jaringan awal hingga era kecerdasan
        buatan modern.
      </p>
      <a
        href="history.html"
        class="btn-custom fade-up inline-block px-[30px] py-[12px] bg-[#0000ee] text-white no-underline font-bold border-[3px] border-slate-900 transition-all duration-200 ease-in-out text-[1.2rem] mt-5 hover:bg-[#0000aa]"
        style="transition-delay: 0.4s"
        >Telusuri</a
      >
    </section>

    <footer
      data-theme="dark"
      class="relative w-full h-screen pt-[120px] pb-[180px] md:py-0 bg-slate-900 flex flex-col justify-center items-center text-slate-100 font-semibold md:snap-start md:snap-always overflow-hidden"
    >
      <p
        class="fade-up text-[1.2rem] tracking-[1px] z-10 md:-translate-y-[120px]"
      >
        &copy; 2026 Virtual Archive
      </p>

      <div
        class="footer-ornaments absolute bottom-0 left-0 w-full flex gap-0 z-[1]"
      >
        <div class="ornament flex-1 flex justify-center items-end">
          <img
            src="asset/icon/mobile.svg"
            alt="Mobile"
            class="w-full h-auto object-contain block ornament-filter"
          />
        </div>
        <div class="ornament flex-1 flex justify-center items-end">
          <img
            src="asset/icon/web.svg"
            alt="Web"
            class="w-full h-auto object-contain block ornament-filter"
          />
        </div>
        <div class="ornament flex-1 flex justify-center items-end">
          <img
            src="asset/icon/database.svg"
            alt="Database"
            class="w-full h-auto object-contain block ornament-filter"
          />
        </div>
        <div class="ornament flex-1 flex justify-center items-end">
          <img
            src="asset/icon/security.svg"
            alt="Security"
            class="w-full h-auto object-contain block ornament-filter"
          />
        </div>
        <div class="ornament flex-1 flex justify-center items-end">
          <img
            src="asset/icon/wifi.svg"
            alt="WiFi"
            class="w-full h-auto object-contain block ornament-filter"
          />
        </div>
        <div class="ornament flex-1 flex justify-center items-end">
          <img
            src="asset/icon/privacy.svg"
            alt="Privacy"
            class="w-full h-auto object-contain block ornament-filter"
          />
        </div>
      </div>
    </footer>

    <script src="script/index.js"></script>
  </body>
</html>
